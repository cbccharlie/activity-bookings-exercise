[project]
name = "activity-bookings"
version = "0.1.0"
description = "Command line client for the ActivityBookings API."
authors = [
    { name = "Carlos Busto Capeáns", email = "carlos.busto@balidea.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
activity-bookings = "activity_bookings.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
